<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>git test project</title><style>
body { margin:0; background:#fff; color:#111; font-family:Arial,Helvetica,sans-serif; }
main { max-width:1400px; margin:0 auto; padding:24px; }
h2 { font-size:1.35rem; margin:2.5rem 0 1rem; font-weight:600; }
h3 { font-size:1rem; line-height:1.5; font-weight:400; margin:.7rem 0; }
h4 { font-size:.9rem; font-weight:400; margin:.35rem 0 1.2rem; }
.flex-container { display:flex; flex-wrap:wrap; align-items:flex-start; gap:14px; margin:1.2rem 0 2rem; }
.media-item { box-sizing:border-box; min-width:0; }
.media-item img,.media-item video { display:block; max-width:100%; height:auto; }
.media-item.full,.media-item.large { width:100%; }
.media-item.half,.media-item.two { width:calc(50% - 7px); }
.media-item.middle { width:min(75%,1000px); }
.media-item.small { width:calc(25% - 11px); }
.media-item.medium { width:calc(33.333% - 10px); }
@media(max-width:700px) { main { padding:14px; } .media-item.small,.media-item.medium,.media-item.half,.media-item.two,.media-item.middle { width:calc(50% - 7px); } }
